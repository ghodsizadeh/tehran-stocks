name: Python CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run tests that require the live TSETMC service
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} pytest -q tests/test_python_compatibility.py

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --python 3.11 --no-sources
      - run: uvx --python 3.11 twine check --strict dist/*
      - name: Install and test the wheel on Python 3.11
        shell: bash
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-home"
          HOME="$RUNNER_TEMP/wheel-home" TEHRAN_STOCKS_AUTO_FILL=0 \
            "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import tehran_stocks'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --no-project --python 3.11 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  integration:
    name: Live TSETMC tests
    if: github.event_name == 'workflow_dispatch' && inputs.live_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - run: uv run --locked --python 3.11 pytest -q tests/test_download_name.py tests/test_download_price.py

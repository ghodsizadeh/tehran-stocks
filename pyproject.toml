[project]
name = "tehran-stocks"
version = "2.1.0"
description = "Data Downloader for Tehran stock market"
authors = [{ name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" }]
maintainers = [{ name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" }]
requires-python = ">=3.11,<4"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = [
    "tehran",
    "tsetmc",
    "iran",
    "stocks",
    "finance",
    "market-data",
    "pandas",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.32.5",
    "SQLAlchemy>=2.0.45",
    "jalali-pandas>=0.2.2",
    "jdatetime>=5.2.0",
    "lxml>=6.0.2",
    "aiohttp>=3.11.0",
    "aiodns>=3.6.1",
    "PyYAML>=6.0.3",
    "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://ghodsizadeh.github.io/tehran-stocks/"
Documentation = "https://ghodsizadeh.github.io/tehran-stocks/"
Repository = "https://github.com/ghodsizadeh/tehran-stocks"
Issues = "https://github.com/ghodsizadeh/tehran-stocks/issues"
Changelog = "https://github.com/ghodsizadeh/tehran-stocks/releases"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "ipython>=9.8.0",
    "ipdb>=0.13.13",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel.sources]
"src/tehran_stocks" = "tehran_stocks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

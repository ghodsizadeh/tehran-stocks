[project]
name = "tehran-stocks"
version = "3.0.0"
description = "Modern, batteries-included, agent-ready Python SDK, CLI, and MCP server for the Tehran Stock Exchange (TSETMC)"
authors = [{ name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" }]
maintainers = [{ name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" }]
requires-python = ">=3.11,<4"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = [
    "tehran",
    "tsetmc",
    "iran",
    "stocks",
    "finance",
    "market-data",
    "pandas",
    "jalali",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx2[http2]>=2.16.2",
    "pandas>=2.1",
    "jalali-pandas>=1.0.0",
    "typer>=0.16.0",
    "mcp>=2.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
duckdb = ["duckdb>=1.1", "duckdb-engine>=0.13"]

[project.urls]
Homepage = "https://ghodsizadeh.github.io/tehran-stocks/"
Documentation = "https://ghodsizadeh.github.io/tehran-stocks/"
Repository = "https://github.com/ghodsizadeh/tehran-stocks"
Issues = "https://github.com/ghodsizadeh/tehran-stocks/issues"
Changelog = "https://github.com/ghodsizadeh/tehran-stocks/releases"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "ipython>=9.8.0",
    "ipdb>=0.13.13",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: live integration tests against cdn.tsetmc.com"]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel.sources]
"src/tehran_stocks" = "tehran_stocks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

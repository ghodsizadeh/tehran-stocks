[project]
name = "tehran-stocks"
version = "2.0.0"
description = "Data Downloader for Tehran stock market"
authors = [{ name = "Mehdi Ghodsizadeh", email = "mehdi.ghodsizadeh@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "requests>=2.32.5",
    "SQLAlchemy>=2.0.45",
    "jalali-pandas>=0.2.2",
    "lxml>=6.0.2",
    "aiohttp>=3.11.0",
    "aiodns>=3.6.1",
    "PyYAML>=6.0.3",
    "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://ghodsizadeh.github.io/tehran-stocks/"
Repository = "https://github.com/ghodsizadeh/tehran-stocks.git"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "ipython>=9.8.0",
    "ipdb>=0.13.13",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel]
include = ["src/tehran_stocks"]

[tool.hatch.build.targets.wheel.sources]
"src/tehran_stocks" = "tehran_stocks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
